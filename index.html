<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>300天快乐，芯芯修宝宝！</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #ffe4e8 0%, #ffc0cb 100%);
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            text-align: center;
            color: #d14780;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            padding: 35px 20px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.95);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 1.85em;
            margin: 0 0 12px 0;
            color: #ff3377;
            text-shadow: 1px 1px 3px rgba(255, 105, 180, 0.3);
            line-height: 1.3;
        }
        /* 隐藏机关：标题爱心心跳效果 */
        .secret-trigger {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s;
            animation: pulseHeart 1.4s infinite ease-in-out;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.28); }
            100% { transform: scale(1); }
        }
        .subtitle {
            font-size: 1.02em;
            color: #a04064;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .characters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            justify-items: center;
            margin-bottom: 22px;
        }
        .character-card {
            background: #ffffff;
            width: 125px;
            height: 125px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(255, 182, 193, 0.5);
            transition: all 0.25s ease;
            border: 3px solid #ffedf0;
        }
        .character-card:hover, .character-card:active {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 105, 180, 0.45);
            border-color: #ff99bb;
        }
        .emoji {
            font-size: 3.2em;
            margin-bottom: 4px;
        }
        .name-tag {
            font-size: 0.95em;
            font-weight: bold;
            color: #ff6699;
        }
        .tip-text {
            font-size: 0.88em;
            color: #b05070;
            margin-top: 10px;
        }

        /* 漫天爱心雨动画 */
        .falling-heart {
            position: fixed;
            top: -50px;
            z-index: 999;
            pointer-events: none;
            animation: heartFall linear forwards;
        }
        @keyframes heartFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* 弹窗样式 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 85%;
            max-width: 340px;
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 1001;
            border: 4px solid #ffccd8;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active {
            transform: translate(-50%, -50%) scale(1);
        }
        .modal-icon {
            font-size: 3.5em;
            margin-bottom: 10px;
        }
        .modal-title {
            font-size: 1.25em;
            font-weight: bold;
            color: #ff3377;
            margin-bottom: 12px;
        }
        .modal-msg {
            font-size: 1.05em;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 25px;
            word-break: break-word;
        }
        .close-btn {
            background: linear-gradient(135deg, #ff6b95, #ff4071);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 113, 0.3);
            transition: transform 0.2s;
        }
        .close-btn:active {
            transform: scale(0.96);
        }

        /* 隐藏情书专属标签 */
        .secret-badge {
            display: inline-block;
            background: #fff0f5;
            color: #ff3377;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.82em;
            font-weight: bold;
            margin-bottom: 8px;
            border: 1px dashed #ff99bb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            <span class="secret-trigger" onclick="triggerSecretEasterEgg()">💖</span>
            300天快乐!芯芯修宝宝！
            <span class="secret-trigger" onclick="triggerSecretEasterEgg()">💖</span>
        </h1>

        <div class="subtitle">不知不觉我们已经相伴了 300 个日夜<br>今天有几位修可爱要对修宝宝讲悄悄话哟，宝宝不能外流！！！ 👇</div>

        <div class="characters-grid">
            <div class="character-card" onclick="openPopup('💩', '小便便说：', '300天快乐呀！祝修宝宝的每一天都像吃到了甜甜的迪拜巧克力一样开心，以后也要按时拉拉，做健康修宝宝哦！')">
                <div class="emoji">💩</div>
                <div class="name-tag">小便便</div>
            </div>

            <div class="character-card" onclick="openPopup('🐷', '昊昊猪说：', '感谢修宝宝这300天的温柔陪伴，修宝宝笑起来的时候全世界最口爱！我们要永远黏在一起不分开哟muamua哒~')">
                <div class="emoji">🐷</div>
                <div class="name-tag">昊昊猪</div>
            </div>

            <div class="character-card" onclick="openPopup('🐻', '臭噜噜说：', '给你一个大大的噜噜抱！未来的每一个300天，我都会像臭噜噜一样守护修宝宝，为修宝宝遮风挡雨，做你的可爱胖噜噜！')">
                <div class="emoji">🐻</div>
                <div class="name-tag">臭噜噜</div>
            </div>

            <div class="character-card" onclick="openPopup('🐶', '线条小狗说：', '汪汪！你系全世界最棒的女朋友！每一分每一秒都超级超级爱修宝宝，永远对修宝宝流口水！汪汪！')">
                <div class="emoji">🐶</div>
                <div class="name-tag">线条小狗</div>
            </div>
        </div>

        <div class="tip-text">✨ 点击小可爱会有专属祝福掉落哦 ✨</div>
    </div>

    <!-- 普通弹窗组件 -->
    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    <div class="modal" id="modal">
        <div class="modal-icon" id="mIcon">💩</div>
        <div class="modal-title" id="mTitle">小可爱说：</div>
        <div class="modal-msg" id="mMsg">祝福语</div>
        <button class="close-btn" onclick="closePopup()">亲昊昊一口 💖</button>
    </div>

    <!-- 隐藏情书彩蛋弹窗 -->
    <div class="modal" id="secretModal">
        <div class="secret-badge">🎉 解锁隐藏彩蛋 · 专属小情话</div>
        <div class="modal-icon">💌</div>
        <div class="modal-title">昊昊写给修宝宝的情书哟</div>
        <div class="modal-msg" style="text-align: left; font-size: 0.98em; line-height: 1.7;">
            恭喜修宝宝找到了这个秘密机关！<br><br>
            这300天里，有宝宝在的每一秒都变得超级有意义。无论开心还是撒娇，你都是我心里最最最可爱的修宝宝。<br><br>
            以后的第600天、第1000天、还有无数个日子，我都要牵着修宝宝的手一直走下去！永远爱宝宝muamua哒～ ❤️
        </div>
        <button class="close-btn" onclick="closeSecretPopup()">永远爱昊昊 💖</button>
    </div>

    <script>
        // 普通弹窗
        function openPopup(icon, title, message) {
            document.getElementById('mIcon').innerText = icon;
            document.getElementById('mTitle').innerText = title;
            document.getElementById('mMsg').innerText = message;
            document.getElementById('overlay').style.display = 'block';
            const modal = document.getElementById('modal');
            modal.style.display = 'block';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closePopup() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
            }, 200);
        }

        // 隐藏机关：爱心雨特效 + 弹出情书
        function triggerSecretEasterEgg() {
            createHeartRain();
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'block';
                const secretModal = document.getElementById('secretModal');
                secretModal.style.display = 'block';
                setTimeout(() => secretModal.classList.add('active'), 10);
            }, 400);
        }

        function closeSecretPopup() {
            const secretModal = document.getElementById('secretModal');
            secretModal.classList.remove('active');
            setTimeout(() => {
                secretModal.style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
            }, 200);
        }

        // 漫天爱心雨生成器
        function createHeartRain() {
            const hearts = ['💖', '💕', '🌸', '✨', '💗', '🥰'];
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'falling-heart';
                    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 95 + 'vw';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 3500);
                }, i * 70);
            }
        }
    </script>
</body>
</html>
